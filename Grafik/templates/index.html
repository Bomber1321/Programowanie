<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Grafik{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}">
</head>
<body>
    <div class="container"> 
    <header>
        <h1>Grafik</h1>
        <div class="nav"> 
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('list_employees') }}">Employee List</a>
        </div>
    </header>
    <section class="content">
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <ul class=flashes>
    {% for message in messages %}
    <li>{{ message }}</li>
    {% endfor %}
    </ul>
    {% endif %}
    {% endwith %}
    {% block content %}
    <p>Witaj w aplikacji Grafik</p>
    {% endblock %}
    </section> 
    </div>
</body>
</html>
